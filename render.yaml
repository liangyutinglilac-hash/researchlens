services:
  - type: web
    name: researchlens
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run app.py --server.address 0.0.0.0 --server.port $PORT --server.headless true --browser.serverAddress researchlens-l1js.onrender.com --browser.serverPort 443 --server.enableWebsocketCompression false
    envVars:
      - key: STREAMLIT_BROWSER_GATHER_USAGE_STATS
        value: "false"
